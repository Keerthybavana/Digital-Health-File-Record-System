{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 65vh;">
        <div class="col-md-6 col-lg-5">
            <div class="atl-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center atl-brand-icon mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Log in to HealthDoc ML</h3>
                    <p class="text-muted small">Access your clinical file vault and medical records</p>
                </div>

                <form action="{{ url_for('main.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-muted small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control filter-input border-start-0" id="email" name="email" placeholder="patient@hospital.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-semibold text-muted small">Security Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control filter-input border-start-0" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-muted small" for="remember">Keep me signed in on this device</label>
                    </div>

                    <button type="submit" class="btn btn-atl-primary w-100 py-2.5 fs-6 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="mb-0 text-muted small">Don't have an account yet? <a href="{{ url_for('main.register') }}" class="fw-bold text-primary">Create one free</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
