{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5">
        <div class="card card-custom p-4 p-md-5">
            <div class="card-body p-0">
                <div class="text-center mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center bg-primary-light text-primary rounded-circle mb-3 shadow-sm" style="width: 64px; height: 64px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </span>
                    <h3 class="fw-bold text-dark mb-1">Patient Portal Login</h3>
                    <p class="text-muted small">Log in to view clinical documents and manage health records</p>
                </div>
                
                <form action="{{ url_for('main.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-muted small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-2" id="email" name="email" placeholder="name@domain.com" required autofocus style="border-radius: 0 0.5rem 0.5rem 0;">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-semibold text-muted small">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0 ps-2" id="password" name="password" placeholder="Enter security password" required style="border-radius: 0 0.5rem 0.5rem 0;">
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-muted small" for="remember">Keep me logged in on this computer</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Secure Sign In
                    </button>
                </form>
                
                <hr class="my-4 text-muted opacity-25">
                
                <div class="text-center">
                    <p class="mb-0 text-muted small">New to the portal? <a href="{{ url_for('main.register') }}" class="text-decoration-none fw-bold text-success">Create a patient account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
