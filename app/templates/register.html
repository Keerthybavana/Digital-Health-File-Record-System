{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card card-custom p-4 p-md-5">
            <div class="card-body p-0">
                <div class="text-center mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center bg-success-light text-success rounded-circle mb-3 shadow-sm" style="width: 64px; height: 64px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </span>
                    <h3 class="fw-bold text-dark mb-1">Create Patient Account</h3>
                    <p class="text-muted small">Register to secure your health reports and start ML classification</p>
                </div>
                
                <form action="{{ url_for('main.register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold text-muted small">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-2" id="name" name="name" placeholder="John Doe" required autofocus style="border-radius: 0 0.5rem 0.5rem 0;">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-muted small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-2" id="email" name="email" placeholder="john.doe@example.com" required style="border-radius: 0 0.5rem 0.5rem 0;">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-muted small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0 ps-2" id="password" name="password" placeholder="Create strong password" required style="border-radius: 0 0.5rem 0.5rem 0;">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold text-muted small">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control border-start-0 ps-2" id="confirm_password" name="confirm_password" placeholder="Re-enter password to verify" required style="border-radius: 0 0.5rem 0.5rem 0;">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2.5 fw-semibold shadow-sm text-white">
                        <i class="bi bi-check-circle me-2"></i> Register Account
                    </button>
                </form>
                
                <hr class="my-4 text-muted opacity-25">
                
                <div class="text-center">
                    <p class="mb-0 text-muted small">Already have an account? <a href="{{ url_for('main.login') }}" class="text-decoration-none fw-bold text-primary">Sign In Here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
