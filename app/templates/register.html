{% extends 'base.html' %}

{% block content %}
<section class="auth-layout">
    <div class="row g-0 align-items-stretch">
        <div class="col-lg-6 auth-visual">
            <img src="{{ url_for('static', filename='images/auth-healthcare.png') }}" alt="Healthcare records and medical care" class="auth-visual-image">
        </div>
        <div class="col-lg-6 auth-form-side d-flex align-items-center justify-content-center p-4 p-lg-5">
            <div class="atl-card auth-form-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center atl-brand-icon mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Create Patient Account</h3>
                    <p class="text-muted small">Start organizing medical records with AI classification</p>
                </div>

                <form action="{{ url_for('main.register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold text-muted small">Full Legal Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control filter-input border-start-0" id="name" name="name" placeholder="John Doe" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-muted small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control filter-input border-start-0" id="email" name="email" placeholder="john.doe@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-muted small">Create Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control filter-input border-start-0" id="password" name="password" placeholder="Create strong password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold text-muted small">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control filter-input border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-atl-primary w-100 py-2.5 fs-6 shadow-sm">
                        <i class="bi bi-check-circle me-1"></i> Register Free Account
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="mb-0 text-muted small">Already have an account? <a href="{{ url_for('main.login') }}" class="fw-bold text-primary">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
